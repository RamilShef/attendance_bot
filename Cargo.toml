[package]
name = "attendance_bot"
version = "0.1.0"
edition = "2021"


[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
sea-orm = { version = "0.12", features = ["sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono"]}
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dotenvy = "0.15"
tracing-subscriber = "0.3"
tracing = "0.1"
anyhow = "1"